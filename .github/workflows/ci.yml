name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup installs the toolchain rust-toolchain.toml pins.
      - run: rustup show active-toolchain
      - run: cargo fmt --check
      - run: cargo test --locked

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - run: cargo build --locked --release --target wasm32-unknown-unknown
      - name: Keep the crate's object alone
        # The archive also holds compiler_builtins, which nothing here calls: the object
        # imports only the host's allocator and the stack pointer, which this checks.
        run: |
          bin="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin"
          full=target/wasm32-unknown-unknown/release/libswf2es_tessellate.a
          member="$("$bin/llvm-ar" t "$full" | grep '^swf2es_tessellate-')"
          test "$(echo "$member" | wc -l)" = 1
          mkdir -p out/object
          (cd out/object && "$bin/llvm-ar" x "../../$full" "$member")
          undefined="$("$bin/llvm-nm" -u "out/object/$member" | awk '{print $2}' | sort | tr '\n' ' ')"
          echo "undefined: $undefined"
          test "$undefined" = "__stack_pointer free malloc realloc "
          "$bin/llvm-nm" --defined-only "out/object/$member" | grep -q ' T lyon_fill$'
          "$bin/llvm-ar" rcsD out/libswf2es_tessellate.a "out/object/$member"
          (cd out && sha256sum libswf2es_tessellate.a > libswf2es_tessellate.a.sha256)
          cat out/libswf2es_tessellate.a.sha256
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libswf2es_tessellate
          path: |
            out/libswf2es_tessellate.a
            out/libswf2es_tessellate.a.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libswf2es_tessellate
      - run: sha256sum -c libswf2es_tessellate.a.sha256
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG"
          --notes "The wasm32 static library built by this tag's CI run, with its SHA-256."
          libswf2es_tessellate.a libswf2es_tessellate.a.sha256
